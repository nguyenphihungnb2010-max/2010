<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chờ Anh Chút Thôi - Happy Women's Day</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05020a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Giao diện thiệp/lịch nổi bật */
        .card-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: rgba(20, 10, 25, 0.85);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
            border: 1px solid rgba(255, 192, 203, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        .card-container h2 {
            margin: 0 0 10px 0;
            color: #ffb6c1;
            font-size: 24px;
        }

        .card-container p {
            font-size: 14px;
            line-height: 1.6;
            color: #fce4ec;
        }

        /* Nút phát nhạc ẩn/hiện */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 105, 180, 0.8);
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .music-control:hover {
            background: rgba(255, 20, 147, 1);
        }
    </style>
</head>
<body>

    <!-- Khung chứa hiệu ứng không gian 3D -->
    <div id="canvas-container"></div>

    <!-- Hộp nội dung thiệp chúc mừng (Ví dụ tượng trưng giống video) -->
    <div class="card-container">
        <h2>Gửi Em !</h2>
        <p>Hôm nay là ngày 20-10, chúc nửa thế giới còn lại luôn xinh đẹp, vui vẻ và luôn chan chứa hạnh phúc. Cảm ơn vì em đã luôn đến bên và mang theo những điều tuyệt vời nhất! ❤️</p>
    </div>

    <!-- Thẻ Audio tích hợp bài hát "Chờ anh chút thôi" -->
    <!-- Bạn có thể thay đổi đường dẫn src thành file nhạc mp3 thực tế của bạn -->
    <audio id="bgMusic" loop>
        <source src="https://example.com/cho-anh-chut-thoi.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ thẻ audio.
    </audio>

    <button class="music-control" onclick="toggleMusic()">🎵 Bật/Tắt Nhạc</button>

    <!-- Thư viện Three.js để tạo hiệu ứng không gian 3D và các khối ảnh xoay -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Xử lý bật tắt nhạc nền
        const music = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
            } else {
                music.play().then(() => {
                    isPlaying = true;
                }).catch(e => {
                    console.log("Cần tương tác trang web để phát nhạc tự động.");
                });
            }
        }

        // Tự động phát nhạc khi người dùng click bất kỳ đâu trên màn hình lần đầu tiên
        document.body.addEventListener('click', () => {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                }).catch(e => {});
            }
        }, { once: true });

        // Khởi tạo hiệu ứng 3D Không gian sao và các hạt không gian bằng Three.js
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Tạo các hạt ánh sáng sao lấp lánh nền trời
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.015,
            color: 0xffc0cb
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 3;

        // Hoạt ảnh chuyển động xoay không gian
        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;
            renderer.render(scene, camera);
        }

        animate();

        // Xử lý thay đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
